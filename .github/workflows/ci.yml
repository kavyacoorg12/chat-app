
name: NestJS CI

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'feat/**'
      
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Build application
        run: |
          cd server
          npm run build

      - name: Build Docker image
        run: docker build -t chat-app ./server
